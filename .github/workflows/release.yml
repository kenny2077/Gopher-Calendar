name: Release

# Push a tag like v0.1.0 (matching manifest.json) to publish a GitHub release
# with the Chrome Web Store zip attached. Building and testing run with a
# read-only token; only the publish job, which runs no dependency code, can write.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the manifest version
        run: test "v$(node -p "require('./extension/manifest.json').version")" = "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v h="## [${GITHUB_REF_NAME#v}]" 'index($0, h) == 1 {on=1; next} /^## \[/ || /^\[[^]]+\]: / {on=0} on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no '## [${GITHUB_REF_NAME#v}]' section"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/gopher-calendar-${{ github.ref_name }}.zip
            notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/gopher-calendar-$GITHUB_REF_NAME.zip" \
            --repo "$GITHUB_REPOSITORY" --title "Gopher Calendar $GITHUB_REF_NAME" --notes-file notes.md
