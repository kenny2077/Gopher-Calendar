name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Manifest is valid JSON with no dev bridge
        run: node -e "const m=require('./extension/manifest.json'); if (m.externally_connectable) throw new Error('externally_connectable must not ship')"
      - name: No local config committed
        run: test ! -f extension/config.local.json
