<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gopher Calendar</title>
<link rel="stylesheet" href="popup.css">
<script type="module" src="popup.js"></script>
</head>
<body>
<main>
  <h1>Gopher Calendar</h1>
  <ul class="sources">
    <li id="src-canvas"><span class="name">Canvas</span><span class="state">deadlines</span></li>
    <li id="src-myu"><span class="name">MyU</span><span class="state">class times</span></li>
  </ul>
  <button class="btn primary" id="sync" type="button">Sync and open calendar</button>
  <button class="btn" id="open" type="button">Open calendar</button>
  <p class="foot">Uses the Canvas and MyU sessions already open in this browser. Read-only, and your data stays here.</p>
</main>
</body>
</html>
